[package]
name = "insomnia-local"
version = "0.1.0"
edition = "2021"
description = "Account-free local API client"
license = "Apache-2.0"
default-run = "insomnia-local"

[lib]
name = "insomnia_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "cookies", "gzip", "brotli", "deflate", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
regex = "1"
url = "2"
rfd = "0.15"
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-native-roots"] }
tonic-reflection = "0.14"
tonic-prost = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.9"
bytes = "1"
http = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
